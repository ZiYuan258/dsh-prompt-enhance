name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege, stated rather than inherited. Without this block the job's
# GITHUB_TOKEN carries the repository default, which is broader than anything
# here needs: the workflow only reads the tree. CodeQL flags the omission as
# `actions/missing-workflow-permissions`, and the alert is correct — a workflow
# that runs on every push should not hold write scope it never uses.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify lib/ is committed and fresh
        run: |
          if ! git diff --quiet lib/; then
            echo "::error::lib/ differs from the committed build — run 'npm run build' and commit before pushing"
            git diff --stat lib/
            exit 1
          fi
